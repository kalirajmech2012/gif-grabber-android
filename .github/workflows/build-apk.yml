
name: Build GIF Grabber APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'gif-grabber-android-project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -o gif-grabber-android-project.zip -d project
          test -f project/settings.gradle
          test -f project/app/build.gradle

      - name: Build APK
        working-directory: project
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GIF-Grabber-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
